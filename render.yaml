services:
  # ── Backend (FastAPI) ──
  - type: web
    name: combined-analyzer-api
    runtime: python
    plan: free
    region: oregon
    rootDir: combined-analyzer/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.12
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false

  # ── Frontend (React + Vite static site) ──
  - type: web
    name: combined-analyzer-frontend
    runtime: static
    rootDir: combined-analyzer/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
